name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential qemu-system-x86 grub-pc-bin grub-common \
            xorriso mtools

      - name: Build release artifacts
        run: make -j"$(nproc)"

      - name: Smoke test the built ISO (fresh disk)
        run: |
          rm -f disk.img
          make test QEMU_TIMEOUT=240

      - name: Package boot image
        run: |
          cp lantest.iso "lantest-os-${GITHUB_REF_NAME}.iso"
          sha256sum "lantest-os-${GITHUB_REF_NAME}.iso" > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lantest OS ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            lantest-os-${{ github.ref_name }}.iso
            SHA256SUMS.txt
