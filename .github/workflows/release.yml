name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential qemu-system-x86 grub-pc-bin grub-common \
            xorriso mtools

      - name: Build release artifacts
        run: make -j"$(nproc)"

      - name: Smoke test the built ISO (fresh disk, up to 3 attempts)
        run: |
          pass=0
          for i in 1 2 3; do
            rm -f disk.img
            if make test QEMU_TIMEOUT=240 > "smoke-$i.log" 2>&1; then
              echo "smoke attempt $i: PASS"; pass=$((pass+1))
            else
              echo "smoke attempt $i: FAIL"
            fi
          done
          echo "boot pass rate: $pass/3" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$pass" -eq 0 ]; then echo "::error::boot smoke failed 3/3"; exit 1; fi

      - name: Package boot image
        run: |
          cp lantest.iso "lantest-os-${GITHUB_REF_NAME}.iso"
          sha256sum "lantest-os-${GITHUB_REF_NAME}.iso" > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lantest OS ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            lantest-os-${{ github.ref_name }}.iso
            SHA256SUMS.txt
