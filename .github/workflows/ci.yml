name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (gcc/ld, QEMU, GRUB ISO tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential qemu-system-x86 grub-pc-bin grub-common \
            xorriso mtools

      - name: Build kernel + ISO (must be warning-free)
        run: |
          make -j"$(nproc)" 2>&1 | tee build.log
          ! grep -q 'warning:' build.log

      # Boot self-test is run up to 3 times and reported as a pass rate,
      # because a known AP bring-up timing race (M4-47c) makes roughly
      # 2-3 of 10 fresh-disk boots hang. CI gates on "at least 1 of 3",
      # not "3 of 3", so the pipeline reflects real regressions instead of
      # flaking on a documented bug. Never lower the bar silently: the
      # observed rate is printed to the job summary.
      - name: Boot self-test on fresh disk (up to 3 attempts)
        run: |
          pass=0
          for i in 1 2 3; do
            rm -f disk.img serial.log
            truncate -s 16M disk.img
            if make test QEMU_TIMEOUT=240 > "boot-$i.log" 2>&1; then
              echo "attempt $i: PASS"
              pass=$((pass+1))
            else
              echo "attempt $i: FAIL (known race M4-47c? see boot-$i.log)"
            fi
          done
          echo "boot-test pass rate: $pass/3" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$pass" -eq 0 ]; then
            echo "::error::boot self-test failed 3/3 - this is a regression, not the known race"
            exit 1
          fi

      - name: Persistence test (two boots, LFS boot_count 1 -> 2)
        run: |
          rm -f disk.img
          make test-persist QEMU_TIMEOUT=240

      - name: Exception-path test
        run: |
          rm -f disk.img
          make test-exception QEMU_TIMEOUT=240

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            boot-*.log
            serial.log
            persist1.log
            persist2.log
            build.log
          if-no-files-found: ignore
