# Lantest OS - GRUB configuration (BIOS / legacy boot)
#
# The kernel is a Multiboot2 ELF64 image placed at /boot/kernel.elf inside
# the ISO. GRUB loads it at 1 MiB and jumps to _start in 32-bit protected
# mode; boot.S then brings the CPU up into 64-bit long mode.
#
# GRUB output intentionally stays on VGA. The kernel logs to COM1 only when a
# UART is actually present, which keeps this ISO usable in VirtualBox/VMware
# without configuring a serial port.

set timeout=0
set default=0

menuentry "Lantest OS (M2 - x86_64)" {
    multiboot2 /boot/kernel.elf
    boot
}
